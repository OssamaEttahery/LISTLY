<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />  
  <link rel="manifest" href="./manifest.json" />
</head>
<body>
  <div class="date-nav">
    <button id="prev-btn"><</button>
    <h1 id="date"></h1>
    <button id="next-btn">></button>
  </div>

  <div class="input-row">
    <input id="todo-input" placeholder="Add a todo..." />
    <button id="add-btn">Add</button>
  </div>

  <div class="input-row">
    <input id="habit-input" placeholder="Add a habit..." />
    <button id="addHabit-btn">Add</button>
  </div>

  <ul id="todo-list"></ul>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date").textContent = today;   

    render();

    const prevButton = document.getElementById("prev-btn");    
    prevButton.addEventListener("click", () => {
      const el = document.getElementById("date");

      const currentDate = new Date(el.textContent);

      const previousDate = new Date(currentDate);
      previousDate.setDate(previousDate.getDate() - 1);

      el.textContent = previousDate.toISOString().split("T")[0];

      render();
    });

    const nextButton = document.getElementById("next-btn");    
    nextButton.addEventListener("click", () => {
      const el = document.getElementById("date");

      const currentDate = new Date(el.textContent);

      const nextDate = new Date(currentDate);
      nextDate.setDate(nextDate.getDate() + 1);

      el.textContent = nextDate.toISOString().split("T")[0];

      render();
    });

    function render() {
      const list = document.getElementById("todo-list");
      list.innerHTML = "";

      const raw = localStorage.getItem("ToDos");
      const todos = raw ? JSON.parse(raw) : [];

      const currentDate = document.getElementById("date").textContent;

      todos
        .filter(todo => todo.date === currentDate)
        .forEach(AddItem);

      const rawHabits = localStorage.getItem("Habits");
      const habits = rawHabits ? JSON.parse(rawHabits) : [];
      const todaysTodos = todos.filter(todo => todo.date === currentDate);
      const todoTexts = new Set(todaysTodos.map(t => t.text));

      habits
        .filter(habit => (Date.parse(habit.date) < Date.parse(currentDate)) && !todoTexts.has(habit.text))
        .forEach(habit => {
          try {
            const date = document.getElementById("date").textContent;
            const newTodo = {
              id: Date.now(),
              date,
              text: habit.text,
              status: "pending"
            };

            todos.push(newTodo);
            localStorage.setItem("ToDos", JSON.stringify(todos));

            AddItem(newTodo);
          } finally {

          }
        });
    }

    const addHabitButton = document.getElementById("addHabit-btn");    
    addHabitButton.addEventListener("click", () => {
      const input = document.getElementById("habit-input");    
      const text = input.value.trim();

      const raw = localStorage.getItem("Habits");
      const habits = raw ? JSON.parse(raw) : [];

      const date = document.getElementById("date").textContent;
      const newHabit = {
        id: Date.now(),
        date,
        text,
      };

      habits.push(newHabit);
      localStorage.setItem("Habits", JSON.stringify(habits));      

      try {
        // 1. load existing todos
        const raw = localStorage.getItem("ToDos");
        const todos = raw ? JSON.parse(raw) : [];

        const date = document.getElementById("date").textContent;
        const newTodo = {
          id: Date.now(),
          date,
          text,
          status: "pending"
        };

        todos.push(newTodo);
        localStorage.setItem("ToDos", JSON.stringify(todos));

        AddItem(newTodo);
      } finally {
        input.value = "";        
      }
    });

    const addButton = document.getElementById("add-btn");    
    addButton.addEventListener("click", () => {
      const input = document.getElementById("todo-input");    
      const text = input.value.trim();

      try {
        // 1. load existing todos
        const raw = localStorage.getItem("ToDos");
        const todos = raw ? JSON.parse(raw) : [];

        const date = document.getElementById("date").textContent;
        const newTodo = {
          id: Date.now(),
          date,
          text,
          status: "pending"
        };

        todos.push(newTodo);
        localStorage.setItem("ToDos", JSON.stringify(todos));

        AddItem(newTodo);
      } finally {
        input.value = "";        
      }
    });

    function AddItem(todo) {
      if (!todo.text) throw "empty item added";
      
      const list = document.getElementById("todo-list");
      const li = document.createElement("li");
      const textEl = document.createElement("span");
      textEl.textContent = todo.text;
      li.appendChild(textEl);

      const btn = document.createElement("button");
      btn.textContent = "x";
      btn.className = "delete-btn";
      
      btn.addEventListener("click", () => {
        deleteTodo(todo.id);
        li.remove();
      });

      const select = document.createElement("select");
      const pending = document.createElement("option");
      pending.value = "pending";
      pending.textContent = "⏳";
      const done = document.createElement("option");
      done.value = "done";
      done.textContent = "✅";
      const undone = document.createElement("option");
      undone.value = "undone";
      undone.textContent = "❌";

      select.addEventListener("change", () => {
        const raw = localStorage.getItem("ToDos");
        const todos = raw ? JSON.parse(raw) : [];

        const updated = todos.map(t => {
          if (t.id === todo.id) {
            return { ...t, status: select.value };
          }
          return t;
        });

        localStorage.setItem("ToDos", JSON.stringify(updated));
      });

      select.appendChild(pending);
      select.appendChild(done);
      select.appendChild(undone);

      select.value = todo.status;
      
      li.appendChild(select);
      li.appendChild(btn);
      list.appendChild(li);
    }

    function deleteTodo(id) {
      const raw = localStorage.getItem("ToDos");
      const todos = raw ? JSON.parse(raw) : [];

      const updated = todos.filter(t => t.id !== id);

      localStorage.setItem("ToDos", JSON.stringify(updated));
    }
  </script>
</body>

<style>
  /* ===== CSS RESET & BASE ===== */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  :root {
    --color-bg: #0f172a;
    --color-surface: #1e293b;
    --color-surface-hover: #334155;
    --color-primary: #3b82f6;
    --color-primary-hover: #2563eb;
    --color-accent: #22c55e;
    --color-danger: #ef4444;
    --color-danger-hover: #dc2626;
    --color-text: #f1f5f9;
    --color-text-muted: #94a3b8;
    --color-border: #334155;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
    --transition: 0.2s ease;
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ===== LAYOUT CONTAINER ===== */
  body > .date-nav,
  body > .input-row,
  body > #todo-list {
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 16px;
    padding-right: 16px;
  }

  /* ===== DATE NAVIGATION ===== */
  .date-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 24px;
    padding-bottom: 8px;
    gap: 12px;
  }

  .date-nav button {
    width: 48px;
    height: 48px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 600;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    border-radius: 50%;
    cursor: pointer;
    transition: all var(--transition);
    flex-shrink: 0;
  }

  .date-nav button:hover {
    background: var(--color-surface-hover);
    border-color: var(--color-primary);
    color: var(--color-primary);
  }

  .date-nav button:active {
    transform: scale(0.95);
  }

  h1 {
    text-align: center;
    margin: 0;
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--color-text);
    background: var(--color-surface);
    padding: 12px 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    flex: 1;
    letter-spacing: 0.5px;
  }

  /* ===== INPUT ROWS ===== */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .input-row:first-of-type {
    margin-top: 20px;
  }

  input {
    flex: 1;
    padding: 14px 16px;
    font-size: 1rem;
    border-radius: var(--radius-md);
    border: 2px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    transition: all var(--transition);
    outline: none;
  }

  input::placeholder {
    color: var(--color-text-muted);
  }

  input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  /* ===== BUTTONS ===== */
  button {
    padding: 14px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: white;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  button:hover {
    background: var(--color-primary-hover);
    box-shadow: var(--shadow);
  }

  button:active {
    transform: scale(0.97);
  }

  /* ===== TODO LIST ===== */
  ul {
    list-style: none;
    padding: 0;
    margin: 24px auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--color-surface);
    padding: 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow);
    transition: all var(--transition);
  }

  li:hover {
    border-color: var(--color-surface-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  li span {
    flex: 1;
    font-size: 1rem;
    color: var(--color-text);
    word-break: break-word;
  }

  /* ===== SELECT DROPDOWN ===== */
  select {
    padding: 10px 12px;
    font-size: 1.25rem;
    border-radius: var(--radius-sm);
    border: 2px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text);
    cursor: pointer;
    transition: all var(--transition);
    outline: none;
    appearance: none;
    text-align: center;
  }

  select:hover {
    border-color: var(--color-primary);
  }

  select:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  /* ===== DELETE BUTTON ===== */
  .delete-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    background: transparent;
    color: var(--color-text-muted);
    border: 2px solid var(--color-border);
    border-radius: var(--radius-sm);
    text-transform: none;
  }

  .delete-btn:hover {
    background: var(--color-danger);
    border-color: var(--color-danger);
    color: white;
    box-shadow: none;
  }

  /* ===== EMPTY STATE ===== */
  ul:empty::after {
    content: "No tasks for this day";
    display: block;
    text-align: center;
    padding: 48px 24px;
    color: var(--color-text-muted);
    font-size: 1rem;
    background: var(--color-surface);
    border-radius: var(--radius-md);
    border: 2px dashed var(--color-border);
  }

  /* ===== TABLET & DESKTOP ===== */
  @media (min-width: 600px) {
    body > .date-nav,
    body > .input-row,
    body > #todo-list {
      padding-left: 24px;
      padding-right: 24px;
    }

    .date-nav {
      padding-top: 40px;
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.25rem;
      padding: 14px 28px;
    }

    input {
      padding: 16px 20px;
    }

    button {
      padding: 16px 28px;
    }

    li {
      padding: 18px 20px;
    }
  }

  @media (min-width: 768px) {
    body > .date-nav,
    body > .input-row,
    body > #todo-list {
      max-width: 560px;
    }

    .date-nav button {
      width: 52px;
      height: 52px;
    }
  }
</style>
</html>
