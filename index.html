<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />  
  <link rel="manifest" href="./manifest.json" />
</head>
<body>
  <h1 id="date"></h2>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date").textContent = today;    
  </script>
</body>
</html>
